name: Check Upstream Release

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-release-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check if dependent workflows are busy
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          for wf in "ts_release.yml" "docker_image.yml"; do
            ACTIVE=$(
              gh run list --workflow="$wf" \
                --repo "$GITHUB_REPOSITORY" \
                --json status \
                --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length'
            )
            if [ "$ACTIVE" -gt 0 ]; then
              echo "⚠️ Workflow '$wf' is running or queued ($ACTIVE run(s)). Skipping this run."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "✅ No conflicting workflows found."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Find missing upstream releases
        if: steps.guard.outputs.skip != 'true'
        id: missing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          MIN_VERSION="MatriX.144.1"

          UPSTREAM_TAGS=$(
            curl -fsSL \
              "https://api.github.com/repos/YouROK/TorrServer/releases?per_page=100" |
            jq -r '[.[] | select(.prerelease == false) | .tag_name] | .[]'
          )

          EXISTING_TAGS=$(git ls-remote --tags origin)

          MISSING=""
          for TAG in $UPSTREAM_TAGS; do
            if ! echo "$TAG" | grep -qE '^MatriX\.'; then
              continue
            fi

            if [ "$(printf '%s\n' "$MIN_VERSION" "$TAG" | sort -V | head -n1)" != "$MIN_VERSION" ]; then
              echo "Skipping (older than $MIN_VERSION): $TAG"
              continue
            fi

            TARGET="${TAG}-bylampa"

            if echo "$EXISTING_TAGS" | awk '{print $2}' | grep -qFx "refs/tags/${TARGET}"; then
              if gh release view "$TARGET" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "Tag and release exist: $TARGET"
                continue
              else
                echo "Tag exists but release missing: $TARGET — will recreate in next step"
              fi
            else
              echo "Missing: $TARGET"
            fi

            if [ -z "$MISSING" ]; then
              MISSING="$TAG"
            else
              MISSING="$MISSING $TAG"
            fi
          done

          echo "tags=$MISSING" >> "$GITHUB_OUTPUT"

          if [ -z "$MISSING" ]; then
            echo "All upstream releases >= $MIN_VERSION already have bylampa tags."
          else
            echo "Tags to create: $MISSING"
          fi

      - name: Fetch upstream, apply patch, create and push tags
        if: steps.guard.outputs.skip != 'true' && steps.missing.outputs.tags != ''
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "bylampa-bot"
          git config user.email "actions@github.com"

          git remote set-url origin \
            "https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Добавляем remote оригинала
          git remote add upstream https://github.com/YouROK/TorrServer.git 2>/dev/null || true

          for TAG in ${{ steps.missing.outputs.tags }}; do
            TARGET="${TAG}-bylampa"
            echo "=== Processing $TARGET ==="

            # 1. Скачиваем чистый код из оригинала по тегу
            git fetch upstream "$TAG"
            git checkout FETCH_HEAD -- .
            git add -A

            # Удаляем триггер по ветке master из docker_image.yml
            if [ -f ".github/workflows/docker_image.yml" ]; then
              sed -i '/branches:.*master/d' .github/workflows/docker_image.yml
              sed -i '/^[[:space:]]*- master$/d' .github/workflows/docker_image.yml
              echo "✅ Removed branches trigger from docker_image.yml"
            fi

            # 2. Удаляем блокировку bylampa из WAF
            if [ -f "server/web/waf/referer.go" ]; then
              sed -i '/bylampa/d' server/web/waf/referer.go
              echo "✅ Patched: removed bylampa from referer.go"
            else
              echo "ℹ️ referer.go not found in $TAG — nothing to patch"
            fi

            git add -A
            git commit -m "Release $TARGET (upstream $TAG + bylampa patch)" || {
              echo "Nothing to commit for $TARGET"
            }

            # 3. Удаляем старый тег, если есть (пересоздание)
            git tag -d "$TARGET" 2>/dev/null || true
            git push origin ":refs/tags/${TARGET}" 2>/dev/null || true

            # 4. Создаём новый тег на свежем коде с патчем
            git tag "$TARGET"
            git push origin "$TARGET" || { echo "Push failed: $TARGET"; continue; }
            echo "✅ Tag pushed: $TARGET"

            sleep 5
          done

          # Пушим master и возвращаемся
          git push origin master
          git checkout master 2>/dev/null || true
